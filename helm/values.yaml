# Values for the official Apache Airflow chart: apache-airflow/airflow 1.22.0
# (Airflow 3.2.2). Install with scripts/install.sh.

# Each task runs in its own pod: no idle Celery workers, per-task resources,
# and a failing task can't take its neighbours down with it.
executor: KubernetesExecutor

# --- Metadata database -------------------------------------------------------
# A managed PostgreSQL (RDS or similar). The connection URI lives in a secret
# created by scripts/create-secrets.sh, never in this file.
postgresql:
  enabled: false
data:
  metadataSecretName: airflow-metadata-db

# Every task pod opens database connections; PgBouncer keeps the count sane.
pgbouncer:
  enabled: true

# --- Keys that must survive upgrades ------------------------------------------
# Left unset, the chart generates new ones on every upgrade, which breaks
# encrypted connections and logs everyone out.
fernetKeySecretName: airflow-fernet-key
apiSecretKeySecretName: airflow-api-secret-key
jwtSecretName: airflow-jwt-secret
webserverSecretKeySecretName: airflow-webserver-secret-key

# Users come from your identity provider or `airflow users create`, not a
# default admin/admin account.
createUserJob:
  enabled: false

# --- DAGs ----------------------------------------------------------------------
# A git-sync sidecar pulls dags/ from this repository every minute, so merging
# to main is the deployment.
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: true
    repo: https://github.com/your-github-user/airflow-setup.git
    branch: main
    subPath: dags
    depth: 1
    period: 60s

# --- Task logs -----------------------------------------------------------------
# Task pods are deleted when they finish, so logs go to S3 and the UI reads
# them back from there. Access comes from IRSA: the service accounts below
# assume an IAM role allowed to read and write the log prefix.
logs:
  persistence:
    enabled: false

config:
  logging:
    remote_logging: "True"
    remote_base_log_folder: s3://example-airflow-logs/task-logs
    remote_log_conn_id: aws_default
    encrypt_s3_logs: "False"

workers:
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/airflow-task-logs

apiServer:
  replicas: 2
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/airflow-task-logs
  podDisruptionBudget:
    enabled: true
    config:
      maxUnavailable: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi

# --- Availability --------------------------------------------------------------
# Two schedulers share the work through row-level locks in PostgreSQL.
scheduler:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    config:
      maxUnavailable: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

dagProcessor:
  enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

triggerer:
  replicas: 1

ingress:
  apiServer:
    enabled: true
    ingressClassName: nginx
    hosts:
      - name: airflow.example.com
        tls:
          enabled: true
          secretName: airflow-tls

# --- Housekeeping ----------------------------------------------------------------
# The metadata database grows with every task instance; prune it weekly.
databaseCleanup:
  enabled: true
  retentionDays: 30
